{% extends "account/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<main class="main">
  <div class="page-title dark-background">
    <div class="container position-relative">
      <h1>Create Chinese Bingo</h1>
      <p>Create a randomized Chinese practice game for one group, all of your students, or all PandaSpeak subscribers.</p>
    </div>
  </div>

  <section class="section">
    <div class="container" data-aos="fade-up">
      <div class="mb-4 d-flex gap-2 flex-wrap">
        <a href="{% url 'teacher_bingo_list' %}" class="btn btn-outline-secondary rounded-pill">My Bingo Games</a>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary rounded-pill">Teacher Dashboard</a>
      </div>

      <div class="card p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary rounded-pill">Create Bingo Game</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const audience = document.getElementById('id_audience');
    const group = document.getElementById('id_student_group');
    if (!audience || !group) return;

    const groupContainer = group.closest('.mb-3') || group.parentElement;

    function updateGroupVisibility() {
      const showGroup = audience.value === 'group';
      if (groupContainer) {
        groupContainer.style.display = showGroup ? '' : 'none';
      }
      if (!showGroup) {
        group.value = '';
      }
    }

    audience.addEventListener('change', updateGroupVisibility);
    updateGroupVisibility();
  });
</script>
{% endblock %}
