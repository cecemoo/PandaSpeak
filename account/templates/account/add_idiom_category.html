{% extends "account/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
  <main class="main">

    <!-- Page Title -->
    <div class="page-title dark-background" style="background-image: url(assets/img/education/showcase-1.webp);">
      <div class="container position-relative">
        <h1>Add Idiom Category</h1>
        <!-- <p>Login to your account to access all features.</p> -->
        <nav class="breadcrumbs">
          <ol>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li class="current">Add Idiom Category</li>
          </ol>
        </nav>
      </div>
    </div><!-- End Page Title -->

    <!-- Add Category Section -->
    <section id="add-category-section" class="add-category-section section">

      <!-- Section Title -->
      <div class="container section-title" data-aos="fade-up">
        <h2>Add New Idiom Category Section</h2>
       
      </div><!-- End Section Title -->

      <div class="container" data-aos="fade-up">
       
        <div>
          <form action="{% url 'add_idiom_category' %}" method="POST" autocomplete="off">
            {% csrf_token %}
            {{ AddIdiomCategoryForm|crispy }}
            <button type="submit" value="submit" class="btn btn-success round">Add Category</button>
          </form>
        </div>
      </div>

    </section><!-- /Add Category Section -->

  </main>
{% endblock %}
