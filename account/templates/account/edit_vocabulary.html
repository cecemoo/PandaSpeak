{% extends "account/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
  <main class="main">

    <!-- Page Title -->
    <div class="page-title dark-background" style="background-image: url(assets/img/education/showcase-1.webp);">
      <div class="container position-relative">
        <h1>Edit Vocabulary</h1>
        <!-- <p>Login to your account to access all features.</p> -->
        <nav class="breadcrumbs">
          <ol>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li class="current">Edit Vocabulary</li>
          </ol>
        </nav>
      </div>
    </div><!-- End Page Title -->

    <!-- Edit Category Section -->
    <section id="edit-category-section" class="edit-category-section section">

      <!-- Section Title -->
      <div class="container section-title" data-aos="fade-up">
        <h2>Edit Vocabulary Section</h2>
       
      </div><!-- End Section Title -->

      <div class="container" data-aos="fade-up">
       
        <div>
          <form action="{% url 'edit_vocabulary' vocab_id=vocab.id %}" method="POST" enctype="multipart/form-data" autocomplete="off">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" value="submit" class="btn btn-success round">Save Changes</button>
          </form>
        </div>
      </div>

    </section><!-- /Edit Vocabulary Section -->

  </main>
{% endblock %}
