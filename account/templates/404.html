{% extends "account/base.html" %}
{% block content %}
<style>
.error-page{min-height:78vh;padding:150px 20px 70px;display:flex;align-items:center;justify-content:center;text-align:center;background:#060606;color:#fff}.error-card{max-width:650px;padding:42px 34px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.22)}.error-panda{font-size:4rem}.error-code{color:#86efac;font-weight:900;letter-spacing:.08em;margin-top:8px}.error-card h1{font-size:clamp(2rem,5vw,3rem);font-weight:950;margin:8px 0 12px}.error-card p{color:#cbd5e1;line-height:1.65;margin-bottom:24px}.error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.error-btn{padding:11px 20px;border-radius:999px;text-decoration:none!important;font-weight:850}.error-home{background:#22c55e;color:#07130b!important}.error-back{background:rgba(255,255,255,.12);color:#fff!important;border:1px solid rgba(255,255,255,.16)}
</style>
<main class="error-page"><div class="error-card"><div class="error-panda">🐼</div><div class="error-code">404 · PAGE NOT FOUND</div><h1>This page wandered off.</h1><p>We couldn't find the PandaSpeak page you're looking for. It may have moved, or the address may have been entered incorrectly.</p><div class="error-actions"><a href="{% url 'home' %}" class="error-btn error-home">Return to PandaSpeak</a><a href="javascript:history.back()" class="error-btn error-back">Go Back</a></div></div></main>
{% endblock %}
