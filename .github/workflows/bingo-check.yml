name: Bingo personal games check (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query personal bingo games on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            cat > /tmp/bingo_check.py <<'PYEOF'
            import django, os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from teacher.bingo_models import BingoGame
            from teacher.models import VocabularyCategory
            from django.db.models import Q

            personal = BingoGame.objects.filter(audience='personal').order_by('id')
            print('PERSONAL_GAMES', personal.count())
            for g in personal:
                print('GAME', g.id, repr(g.title), 'teacher_id', g.teacher_id, 'active', g.is_active, 'type', g.content_type, 'key', g.category_key, 'subcat', repr(g.subcategory), 'level', g.level, 'created', g.created_at)

            cat = VocabularyCategory.objects.filter(category_name__icontains='Abstract').first()
            print('ABSTRACT_CATEGORY', cat.id if cat else None, cat.category_name if cat else None)
            if cat:
                from student.bingo_views import _eligible_materials
                probe = BingoGame(teacher_id=1, title='', audience='personal', content_type='vocabulary', category_key=f'vocabulary:{cat.id}', subcategory='', level='level1')
                print('ELIGIBLE_LEVEL1_ALLSUB', _eligible_materials(probe, 'level1').count())
            print('TOTAL_GAMES', BingoGame.objects.count())
            PYEOF
            PYTHONPATH=$HOME/PandaSpeak venv/bin/python /tmp/bingo_check.py
