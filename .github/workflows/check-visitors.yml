name: Check visitor count (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count DailyVisitor rows on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            source venv/bin/activate
            python -c "
            import django, os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import DailyVisitor
            from django.utils import timezone
            print('ROWS_TOTAL', DailyVisitor.objects.count())
            print('ROWS_TODAY', DailyVisitor.objects.filter(date=timezone.localdate()).count())
            "
