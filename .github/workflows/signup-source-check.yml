name: Signup source check (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count lead signups by traffic source on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            cat > /tmp/check_signup_sources.py <<'PYEOF'
            import os, sys, django, datetime, json
            sys.path.insert(0, os.getcwd())
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from django.utils import timezone
            from django.db.models import Count
            from account.models import LeadMagnetSignup
            start = timezone.make_aware(datetime.datetime(2026, 10, 27, 0, 0, 0))
            qs = LeadMagnetSignup.objects.filter(created_at__gte=start)
            result = {
                'total': qs.count(),
                'total_all_time': LeadMagnetSignup.objects.count(),
                'latest_created_at': str(LeadMagnetSignup.objects.order_by('-created_at').values_list('created_at', flat=True).first()),
                'by_traffic_source': list(qs.values('traffic_source').annotate(n=Count('id')).order_by('-n', 'traffic_source')),
                'by_freebie': list(qs.values('source').annotate(n=Count('id')).order_by('-n', 'source')),
                'by_both': list(qs.values('traffic_source', 'source').annotate(n=Count('id')).order_by('-n')),
            }
            print('SIGNUP_CHECK_JSON=' + json.dumps(result))
            PYEOF
            venv/bin/python /tmp/check_signup_sources.py
            rm -f /tmp/check_signup_sources.py
