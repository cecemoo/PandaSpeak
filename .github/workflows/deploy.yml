name: Deploy PandaSpeak

on:

  push:

    branches:

      - main
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/PandaSpeak

            git pull origin main

            source venv/bin/activate

            pip install -r requirements.txt

            python manage.py migrate

            python manage.py collectstatic --noinput

            (crontab -l 2>/dev/null | grep -v 'release_tutoring_payouts' || true; echo '*/15 * * * * cd $HOME/PandaSpeak && $HOME/PandaSpeak/venv/bin/python manage.py release_tutoring_payouts >> $HOME/PandaSpeak/payout_cron.log 2>&1') | crontab -

            sudo systemctl restart pandaspeak