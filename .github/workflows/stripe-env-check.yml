name: Stripe Env Check (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Stripe env vars on EC2 (names and shapes only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/PandaSpeak
            python3 - <<'PY'
            import re
            wanted = ["STRIPE_PUBLISHABLE_KEY","STRIPE_SECRET_KEY","STRIPE_SUBSCRIPTION_SECRET_KEY","STRIPE_WEBHOOK_SECRET","STRIPE_SUBSCRIPTION_WEBHOOK_SECRET"]
            found = {}
            for line in open(".env"):
                m = re.match(r"\s*([A-Z0-9_]+)\s*=\s*(.*)\s*$", line)
                if m and m.group(1) in wanted:
                    v = m.group(2).strip().strip('"').strip("'")
                    found[m.group(1)] = v
            for k in wanted:
                v = found.get(k)
                if not v:
                    print(k, "MISSING")
                else:
                    print(k, "present len=%d prefix=%s tail=%s" % (len(v), v[:7], v[-4:]))
            vals = {k: v for k, v in found.items() if v}
            if vals.get("STRIPE_SECRET_KEY") and vals.get("STRIPE_SUBSCRIPTION_SECRET_KEY"):
                print("SECRET_EQ_SUBSCRIPTION:", vals["STRIPE_SECRET_KEY"] == vals["STRIPE_SUBSCRIPTION_SECRET_KEY"])
            PY
