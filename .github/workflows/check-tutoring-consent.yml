name: Check tutoring consent (one-off)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Grep deployed tutoring consent code on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/PandaSpeak
            echo "views_gate: $(grep -c tutoring_consent_given course/views.py)"
            echo "record_call: $(grep -c record_tutoring_consent course/views.py)"
            echo "dialog: $(grep -c confirm-tutoring-terms course/templates/course/cart.html)"
            echo "helper: $(grep -c record_tutoring_consent subscription/checkout_consent.py)"
            echo "legacy_gate: $(grep -c tutoring_consent_given subscription/views.py)"
