name: One-off user delete

on:
  workflow_dispatch

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete two junk accounts on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            cat > /tmp/delete_users.py <<'PYEOF'
            import os, django
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import CustomUser
            emails = ['amberlloyd179150@aol.com', 'icecozubuke683@gmail.com']
            for em in emails:
                try:
                    u = CustomUser.objects.get(email=em)
                except CustomUser.DoesNotExist:
                    print(em + ': already absent')
                    continue
                related_total = 0
                for rel in u._meta.related_objects:
                    try:
                        related_total += getattr(u, rel.get_accessor_name()).count()
                    except Exception:
                        pass
                safe = (not u.is_active and u.last_login is None
                        and not u.is_staff and not u.is_superuser
                        and not u.is_teacher and related_total == 0)
                print('%s: is_active=%r last_login=%r related=%d safe=%r' % (
                    em, u.is_active, u.last_login, related_total, safe))
                if not safe:
                    print(em + ': SKIPPED (profile changed)')
                    continue
                u.delete()
                gone = not CustomUser.objects.filter(email=em).exists()
                print(em + ': deleted, verified_gone=%r' % gone)
            print('total users now:', CustomUser.objects.count())
            print('DONE')
            PYEOF
            PYTHONPATH=$HOME/PandaSpeak venv/bin/python /tmp/delete_users.py
