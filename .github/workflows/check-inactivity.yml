name: check-inactivity (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ls ~/PandaSpeak/subscription/management/commands/send_inactivity_reminders.py && crontab -l | grep send_inactivity
            cd ~/PandaSpeak && ~/PandaSpeak/venv/bin/python -c "
            import django, os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from datetime import timedelta
            from django.utils import timezone
            from account.models import CustomUser, Notification
            cutoff = timezone.now() - timedelta(days=5)
            qs = CustomUser.objects.filter(is_active=True, is_staff=False, is_superuser=False, is_teacher=False, last_login__isnull=False, last_login__lt=cutoff).exclude(email='')
            eligible = 0
            for u in qs:
                last = Notification.objects.filter(user=u, title='👋 We Miss You at PandaSpeak!').order_by('-created_at').first()
                if last is None or last.created_at < u.last_login:
                    eligible += 1
            print('CANDIDATES', qs.count(), 'ELIGIBLE_NEW', eligible)
            "
