name: Check recent registrations (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count users by join month on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            source venv/bin/activate
            python -c "
            import django, os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import CustomUser
            from django.db.models.functions import TruncMonth
            from django.db.models import Count
            rows = (CustomUser.objects.annotate(m=TruncMonth('date_joined'))
                    .values('m').annotate(n=Count('id')).order_by('-m')[:6])
            for r in rows:
                print('JOINED', r['m'].date().isoformat(), r['n'])
            latest = CustomUser.objects.order_by('-date_joined').first()
            print('LATEST_JOINED', latest.date_joined.isoformat() if latest else 'none')
            print('TOTAL_USERS', CustomUser.objects.count())
            "
