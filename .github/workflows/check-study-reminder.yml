name: Check study reminder (one-off)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify study reminder on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/PandaSpeak
            echo "module: $(test -f student/study_reminder.py && echo present)"
            echo "hook: $(grep -c maybe_create_study_reminder account/views.py)"
            PYTHONPATH=$HOME/PandaSpeak DJANGO_SETTINGS_MODULE=ChineseRun.settings ~/PandaSpeak/venv/bin/python -c "import django; django.setup(); from student.study_reminder import maybe_create_study_reminder, REMINDER_TITLE; print('import ok:', REMINDER_TITLE)"
