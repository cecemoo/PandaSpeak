name: One-off verify cleanup

on:
  workflow_dispatch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify unverified-cleanup cron and command on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            echo '--- crontab entry:'
            crontab -l | grep delete_unverified_users || echo 'CRON MISSING'
            echo '--- command run:'
            venv/bin/python manage.py delete_unverified_users
            echo '--- users now:'
            PYTHONPATH=$HOME/PandaSpeak venv/bin/python -c "
            import os, django
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import CustomUser
            print(CustomUser.objects.count())
            "
