name: Generate Dialogue Audio (one-off)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Topic slugs, space separated (blank = all)'
        required: false
        default: ''
      level:
        description: 'l2, l3, or blank for both'
        required: false
        default: ''
      force:
        description: 'Regenerate existing files (true/false)'
        required: false
        default: 'false'
      speed_scale:
        description: 'Speed multiplier for duration calibration'
        required: false
        default: '1.0'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate dialogue audio on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd ~/PandaSpeak
            source venv/bin/activate
            ARGS="--speed-scale ${{ inputs.speed_scale }}"
            if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
            if [ -n "${{ inputs.level }}" ]; then ARGS="$ARGS --level ${{ inputs.level }}"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            echo "Running: python manage.py generate_dialogue_audio $ARGS"
            python manage.py generate_dialogue_audio $ARGS
            echo "--- files ---"
            ls -la student/static/student/dialogues/ || true
            which ffmpeg ffprobe || true
