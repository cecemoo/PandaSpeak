name: Set lead followup token (one-off)

on:
  workflow_dispatch:

jobs:
  set-token:
    runs-on: ubuntu-latest
    steps:
      - name: Write token into server .env and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: LEAD_FOLLOWUP_TOKEN
          script: |
            set -e
            cd ~/PandaSpeak
            touch .env
            if grep -q '^LEAD_FOLLOWUP_TOKEN=' .env; then
              sed -i "s|^LEAD_FOLLOWUP_TOKEN=.*|LEAD_FOLLOWUP_TOKEN=$LEAD_FOLLOWUP_TOKEN|" .env
            else
              echo "LEAD_FOLLOWUP_TOKEN=$LEAD_FOLLOWUP_TOKEN" >> .env
            fi
            grep -c '^LEAD_FOLLOWUP_TOKEN=' .env
            sudo systemctl restart pandaspeak
        env:
          LEAD_FOLLOWUP_TOKEN: ${{ secrets.LEAD_FOLLOWUP_TOKEN }}
