name: Check page-view tracking (one-off)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read VisitorAction counts on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/PandaSpeak
            PYTHONPATH=$HOME/PandaSpeak ~/PandaSpeak/venv/bin/python - <<'PY'
            import os, django
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from django.utils import timezone
            from account.models import VisitorAction
            today = timezone.localdate()
            print('SERVER_DATE', today)
            for a in ('tutoring_view', 'course_detail_view', 'about_view', 'register_view'):
                rows = VisitorAction.objects.filter(action=a)
                print(a, 'today=', rows.filter(date=today).count(), 'total_visitors=', rows.values('visitor_key').distinct().count())
            PY
