name: One-off users snapshot

on:
  workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot all accounts on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            cat > /tmp/users_snapshot.py <<'PYEOF'
            import os, django
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import CustomUser
            for u in CustomUser.objects.all().order_by('date_joined'):
                related_total = 0
                for rel in u._meta.related_objects:
                    try:
                        related_total += getattr(u, rel.get_accessor_name()).count()
                    except Exception:
                        pass
                print('%s | active=%r staff=%r teacher=%r joined=%s last_login=%s related=%d' % (
                    u.email, u.is_active, u.is_staff, u.is_teacher,
                    u.date_joined, u.last_login, related_total))
            print('DONE')
            PYEOF
            PYTHONPATH=$HOME/PandaSpeak venv/bin/python /tmp/users_snapshot.py
