name: Check visitor actions (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count VisitorAction rows on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PandaSpeak
            source venv/bin/activate
            python -c "
            import django, os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ChineseRun.settings')
            django.setup()
            from account.models import VisitorAction
            from django.utils import timezone
            today = timezone.localdate()
            for action in ('help_chat', 'challenge_play', 'register_view'):
                rows = VisitorAction.objects.filter(action=action)
                print('ACTION', action, 'TODAY', rows.filter(date=today).count(), 'TOTAL', rows.count())
            keys = set(VisitorAction.objects.filter(date=today, action='help_chat').values_list('visitor_key', flat=True))
            keys &= set(VisitorAction.objects.filter(date=today, action='challenge_play').values_list('visitor_key', flat=True))
            keys &= set(VisitorAction.objects.filter(date=today, action='register_view').values_list('visitor_key', flat=True))
            print('VISITORS_WITH_ALL_THREE_TODAY', len(keys))
            for action in ('help_chat', 'challenge_play', 'register_view'):
                ks = VisitorAction.objects.filter(date=today, action=action).values_list('visitor_key', flat=True)
                print('KEYS', action, [k[:12] for k in ks])
            "
