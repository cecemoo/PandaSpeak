

<div class="booking-card d-flex justify-content-between align-items-center">
    <div>
        <h4>{{ b.timeslot.course.title }}</h4>
        <p>Teacher: {{ b.timeslot.course.teacher.first_name }} {{ b.timeslot.course.teacher.last_name }}</p>
        <p>{{ b.timeslot.start_time|date:"M d, Y" }} · {{ b.timeslot.start_time|date:"g:i A" }}</p>
        <span class="badge bg-success">{{ b.status }}</span>
    </div>

    {% if b.can_cancel %}
    <form action="{% url 'course:cancel_booking' b.pk %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger btn-sm">Cancel</button>
    </form>
    {% endif %}
</div>
